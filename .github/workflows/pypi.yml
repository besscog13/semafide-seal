name: Publish to PyPI

# Manual only. This workflow publishes to production PyPI.
# Trusted Publishing must be configured on pypi.org for this repository,
# workflow filename pypi.yml, and environment pypi before the first upload.
#
# The claim under test is that this exact state of main can be installed
# from the public index. The workflow refuses any ref other than main.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish. Must be main."
        required: true
        default: "main"
        type: string

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main
        run: |
          ref='${{ inputs.ref }}'
          case "$ref" in
            main|refs/heads/main) ;;
            *)
              echo "Refusing to publish '$ref'. Production PyPI is for main only."
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # A publish is the one irreversible surface here. semafide-seal 0.0.1,
      # uploaded 2026-09-11, carries two uses of a word CLAUDE.md bans by
      # name, in witness.py and capture/assignment.py. Both were corrected in
      # the repository on 2026-09-24 and neither correction reaches the file
      # on PyPI, because a release cannot be edited and a yanked version is
      # still downloadable. Until this step existed, this workflow checked
      # out, built and uploaded without running the tests or any check: it
      # trusted that main was green at some point, which is not the same as
      # green on the tree being shipped.
      #
      # These run against the checked-out ref, so what is asserted is the
      # exact tree that becomes the artifact.
      - name: The tree being shipped passes its own checks
        run: |
          python -m pip install -r code/seal/requirements.txt
          python -m pip install pytest
          python -m pytest code/tests -q
          python .github/scripts/check_language.py --selftest
          python .github/scripts/check_language.py
          python .github/scripts/check_cited_symbols.py --selftest
          python .github/scripts/check_cited_symbols.py
          python .github/scripts/check_retired_vocabulary.py
          python .github/scripts/check_writing_lint.py

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/semafide-seal/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: pypi-dists
          path: dist/

      # This tag is annotated, unlike every actions/* tag pinned here, so the
      # SHA is the peeled commit rather than the tag object `git ls-remote
      # --tags --refs` reports. Confirm a bump with the `^{}` line, which
      # means dropping `--refs`. The unpeeled value does not resolve.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
