name: Publish to PyPI

# Manual only. This workflow publishes to production PyPI.
# Trusted Publishing must be configured on pypi.org for this repository,
# workflow filename pypi.yml, and environment pypi before the first upload.
#
# The claim under test is that this exact state of main can be installed
# from the public index. The workflow refuses any ref other than main.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish. Must be main."
        required: true
        default: "main"
        type: string

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main
        run: |
          ref='${{ inputs.ref }}'
          case "$ref" in
            main|refs/heads/main) ;;
            *)
              echo "Refusing to publish '$ref'. Production PyPI is for main only."
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/semafide-seal/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: pypi-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
