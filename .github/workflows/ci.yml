name: CI

on:
  push:
  pull_request:
    branches:
      - main

# Neither job below pushes, comments, or publishes anything. The default
# GITHUB_TOKEN scope is an organisation setting this file cannot see, so
# stating the minimum explicitly, read-only, means a compromised step or a
# malicious dependency pulled in by pip has nothing to write with, regardless
# of what the default happens to be.
#
# Feature branches used to get CI only via a PR into main (except claude/**).
# Push-to-any-branch is cheap here and means a branch exists as evidence
# before anyone opens a PR.
permissions:
  contents: read

jobs:
  seal:
    name: seal package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r code/seal/requirements.txt

      - name: Tests
        working-directory: code
        run: python -m pytest tests -q

      - name: Demo runs end to end
        working-directory: code
        run: python -m seal.demo

      - name: README quotes the demo accurately
        run: |
          python - <<'PY'
          import difflib, pathlib, re, subprocess, sys

          HEADING = "## What the demo prints"
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")

          if HEADING not in readme:
              sys.exit(f"{HEADING!r} is not in README.md; this check has "
                       "nothing to assert")

          after = readme.split(HEADING, 1)[1]
          block = re.search(r"```\n(.*?)```", after, re.DOTALL)
          if block is None:
              sys.exit(f"no fenced block follows {HEADING!r} in README.md")
          claimed = block.group(1).rstrip("\n")

          actual = subprocess.run(
              [sys.executable, "-m", "seal.demo_60s"],
              cwd="code", capture_output=True, text=True, check=True,
          ).stdout.rstrip("\n")

          if claimed == actual:
              print("README demo block matches what seal.demo_60s prints")
              sys.exit(0)

          print("::error::README.md quotes output seal.demo_60s no longer "
                "produces. Regenerate it: cd code && python -m seal.demo_60s")
          print("\n".join(difflib.unified_diff(
              claimed.splitlines(), actual.splitlines(),
              fromfile="README.md block", tofile="seal.demo_60s", lineterm="")))
          sys.exit(1)
          PY

      # Correspondence, not generation. There is no exporter in this repository.
      - name: The system map agrees with its source
        run: python .github/scripts/check_system_map.py

      - name: Retired vocabulary stays on its licensed lines
        run: python .github/scripts/check_retired_vocabulary.py

      - name: Dependency isolation
        working-directory: code
        run: |
          python - <<'PY'
          import importlib, sys
          before = set(sys.modules)
          importlib.import_module("seal.demo")
          forbidden = ("pmc", "numpy", "scipy", "sklearn", "fastapi",
                       "uvicorn", "pydantic", "starlette", "z3",
                       "hypothesis")
          leaked = sorted(m for m in set(sys.modules) - before
                          if any(f in m for f in forbidden))
          if leaked:
              raise SystemExit(f"seal pulled in {leaked}")
          print("clean: cryptography and the standard library only")
          PY

  specs:
    name: formal specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r code/seal/requirements.txt
          pip install -r specs/requirements.txt

      - name: Run every SMT spec
        run: |
          set -o pipefail
          failed=0
          mapfile -t specs < <(find specs -name "SPEC_*.py" -type f | sort)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs found. This job asserts something, so that is a failure."
            exit 1
          fi
          for spec in "${specs[@]}"; do
            echo "::group::$spec"
            if python "$spec"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$spec::POLICY BREACH in $spec"
              failed=1
            fi
          done
          exit $failed

  dist:
    name: build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semafide-seal-dist
          path: dist/
          if-no-files-found: error
