name: CI

on:
  push:
  pull_request:
    branches:
      - main
  # The stranded-branch job below is the reason these two exist. A branch goes
  # stale precisely because nobody is touching it, so a check that only runs
  # when somebody pushes cannot see the case it was written for.
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

# Neither job below pushes, comments, or publishes anything. The default
# GITHUB_TOKEN scope is an organisation setting this file cannot see, so
# stating the minimum explicitly, read-only, means a compromised step or a
# malicious dependency pulled in by pip has nothing to write with, regardless
# of what the default happens to be.
#
# Feature branches used to get CI only via a PR into main (except claude/**).
# Push-to-any-branch is cheap here and means a branch exists as evidence
# before anyone opens a PR.
permissions:
  contents: read

jobs:
  seal:
    name: seal package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r code/seal/requirements.txt

      - name: Tests
        working-directory: code
        run: python -m pytest tests -q

      - name: Demo runs end to end
        working-directory: code
        run: python -m seal.demo

      - name: README quotes the demo accurately
        run: |
          python - <<'PY'
          import difflib, pathlib, re, subprocess, sys

          HEADING = "## What the demo prints"
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")

          if HEADING not in readme:
              sys.exit(f"{HEADING!r} is not in README.md; this check has "
                       "nothing to assert")

          after = readme.split(HEADING, 1)[1]
          block = re.search(r"```\n(.*?)```", after, re.DOTALL)
          if block is None:
              sys.exit(f"no fenced block follows {HEADING!r} in README.md")
          claimed = block.group(1).rstrip("\n")

          actual = subprocess.run(
              [sys.executable, "-m", "seal.demo_60s"],
              cwd="code", capture_output=True, text=True, check=True,
          ).stdout.rstrip("\n")

          if claimed == actual:
              print("README demo block matches what seal.demo_60s prints")
              sys.exit(0)

          print("::error::README.md quotes output seal.demo_60s no longer "
                "produces. Regenerate it: cd code && python -m seal.demo_60s")
          print("\n".join(difflib.unified_diff(
              claimed.splitlines(), actual.splitlines(),
              fromfile="README.md block", tofile="seal.demo_60s", lineterm="")))
          sys.exit(1)
          PY

      # Correspondence, not generation. There is no exporter in this repository.
      - name: The system map agrees with its source
        run: python .github/scripts/check_system_map.py

      - name: Retired vocabulary stays on its licensed lines
        run: python .github/scripts/check_retired_vocabulary.py

      - name: Dependency isolation
        working-directory: code
        run: |
          python - <<'PY'
          import importlib, sys
          before = set(sys.modules)
          importlib.import_module("seal.demo")
          forbidden = ("pmc", "numpy", "scipy", "sklearn", "fastapi",
                       "uvicorn", "pydantic", "starlette", "z3",
                       "hypothesis")
          leaked = sorted(m for m in set(sys.modules) - before
                          if any(f in m for f in forbidden))
          if leaked:
              raise SystemExit(f"seal pulled in {leaked}")
          print("clean: cryptography and the standard library only")
          PY

  specs:
    name: formal specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r code/seal/requirements.txt
          pip install -r specs/requirements.txt

      - name: Run every SMT spec
        run: |
          set -o pipefail
          failed=0
          mapfile -t specs < <(find specs -name "SPEC_*.py" -type f | sort)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs found. This job asserts something, so that is a failure."
            exit 1
          fi
          for spec in "${specs[@]}"; do
            echo "::group::$spec"
            if python "$spec"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$spec::POLICY BREACH in $spec"
              failed=1
            fi
          done
          exit $failed

  # ---------------------------------------------------------------------------
  # Work that exists only on a branch is work nobody can find.
  #
  # A commit pushed to a feature branch and never opened as a pull request is
  # invisible: it is not on main, no review surface names it, and the branch
  # list is not somewhere anyone looks. This repository has lost work that way,
  # and the private tree that mirrors it added this check first for the same
  # reason.
  #
  # Three states are acceptable and everything else is reported. A branch whose
  # commits are already upstream is merged. A branch with an open pull request
  # is in flight. A branch that moved within the grace window is too new to
  # judge, since a branch is normally pushed before its pull request exists.
  #
  # Runs on main, on the schedule, and on manual dispatch. Not on pull requests
  # and not on feature branches: the branch under review is exactly the one that
  # legitimately has unmerged commits, so gating a pull request on this would
  # make red the normal state and train everyone to ignore it.
  # ---------------------------------------------------------------------------
  stranded:
    name: no work stranded off main
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reading pull requests is the whole point: without it every in-flight
    # branch reads as abandoned. Nothing here writes.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # git cherry compares whole histories. The default shallow checkout
          # cannot answer whether a commit is already upstream.
          fetch-depth: 0

      - name: Every branch is merged, in flight, or reported
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GRACE_HOURS=12

          git fetch --quiet --prune origin "+refs/heads/*:refs/remotes/origin/*"

          # A failed or rate-limited call must not read as "no open pull
          # requests", which would report every in-flight branch as abandoned.
          if ! curl -sS --fail-with-body -o /tmp/prs.json \
               -H "Accept: application/vnd.github+json" \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100"; then
            echo "::error::could not list open pull requests; this is not a"
            echo "::error::stranded-work result. Refusing to guess."
            exit 1
          fi
          python3 -c "import json;print(chr(10).join(p['head']['ref'] for p in json.load(open('/tmp/prs.json'))))" > /tmp/open_prs.txt

          now=$(date -u +%s)
          stranded=0
          looked=0

          # `origin` is in that filter because refs/remotes/origin/HEAD
          # abbreviates to `origin`, not to `origin/HEAD`, so filtering only
          # the long name lets a phantom branch into the loop. It reads as
          # merged and never fails the job, so the symptom is an inflated
          # branch count rather than a false error. actions/checkout does not
          # currently create that ref, which is why this has never shown up in
          # a run, and that is a fact about the action rather than about this
          # check. Confirmed directly against a local clone that does have it.
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
                       | grep -vx 'origin/main' | grep -vx 'origin/HEAD' \
                       | grep -vx 'origin'); do
            branch=${ref#origin/}
            looked=$((looked + 1))

            # `git cherry` marks a commit `-` when an equivalent change is
            # already upstream, which is what makes this correct across squash
            # merges: the branch ref can survive the merge and still be empty.
            unmerged=$(git cherry origin/main "$ref" | grep -c '^+' || true)
            if [ "$unmerged" -eq 0 ]; then
              echo "merged     $branch"
              continue
            fi

            if grep -qxF "$branch" /tmp/open_prs.txt; then
              echo "in flight  $branch ($unmerged not on main, open pull request)"
              continue
            fi

            age_h=$(( (now - $(git log -1 --format=%ct "$ref")) / 3600 ))
            if [ "$age_h" -lt "$GRACE_HOURS" ]; then
              echo "recent     $branch ($unmerged not on main, ${age_h}h old, inside the grace window)"
              continue
            fi

            echo "::error::$branch carries $unmerged commit(s) that are not on main, has no open pull request, and last moved ${age_h}h ago"
            git cherry -v origin/main "$ref" | sed 's/^+ /  stranded: /'
            stranded=1
          done

          if [ "$stranded" -ne 0 ]; then
            echo "::error::Work is recorded on a branch and is not on main. Open a"
            echo "::error::pull request for it, or delete the branch if it is dead."
            exit 1
          fi
          echo "clean: $looked branch(es) beside main, none carrying stranded work"

  dist:
    name: build artifacts
    runs-on: ubuntu-latest
    # Skipped on the daily cron. The schedule was added for the stranded job,
    # and this one uploads an artifact on every run, so leaving it ungated
    # would accumulate a build a day to answer a question nobody asked. A
    # scheduled run is asking whether work is stranded, not whether the wheel
    # still builds; every push and every pull request still answers that.
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semafide-seal-dist
          path: dist/
          if-no-files-found: error

      # Building is not evidence the distribution works. pip install -e . and
      # pytest from code/ resolve seal from the checkout via pythonpath.
      # This step installs the wheel in a venv that is not the repository,
      # then refuses to proceed if import seal still points at the checkout.
      - name: Install wheel outside the checkout
        run: |
          set -euo pipefail
          VENV="${RUNNER_TEMP}/wheel-venv"
          WORK="${RUNNER_TEMP}/wheel-work"
          python -m venv "$VENV"
          "$VENV/bin/pip" install --upgrade pip
          "$VENV/bin/pip" install dist/*.whl pytest hypothesis
          mkdir -p "$WORK"
          cp -R code/tests "$WORK/tests"
          unset PYTHONPATH
          "$VENV/bin/python" - <<PY
          import pathlib, seal, sys
          here = pathlib.Path(seal.__file__).resolve()
          checkout = pathlib.Path("${{ github.workspace }}").resolve()
          print("seal.__file__ =", here)
          if checkout in here.parents or here == checkout:
              sys.exit(f"import seal resolved to the checkout ({here})")
          print("import seal resolved to the installed wheel")
          PY
          "$VENV/bin/python" -m seal.demo_60s
          # -o pythonpath= defeats pyproject.toml's pythonpath = ["code"].
          # Running from $WORK keeps cwd off the package source.
          "$VENV/bin/pytest" "$WORK/tests" -q -o pythonpath= -o testpaths=
