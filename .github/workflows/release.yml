name: Release

# Attach sdist and wheel to a GitHub Release when a version tag is pushed.
# This is not a PyPI publish. Uploading to PyPI needs a trusted publisher
# or an API token and a decision that 0.0.1-pre-alpha should be on the index.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: attach dist to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
